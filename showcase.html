                            <div class="showcase-detail__compare">
                                <div class="showcase-detail__col">
                                    <p class="showcase-detail__label">Før:</p>
                                    <img src="/images/golf-gti-mk6-3.jpg" alt="Golf GTI MK6 før soting – bilde 1" loading="lazy">
